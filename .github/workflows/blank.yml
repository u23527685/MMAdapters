name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  super-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Super-Linter
        uses: super-linter/super-linter@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          VALIDATE_CLANG_FORMAT: true
          VALIDATE_C_CPP: true

  auto-format:
    runs-on: ubuntu-latest
    needs: super-linter
    if: always() && (needs.super-linter.result == 'failure' || needs.super-linter.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set up clang-format
        run: sudo apt-get install -y clang-format

      - name: Create .clang-format configuration
        run: |
          cat > .clang-format << EOF
          BasedOnStyle: LLVM
          IndentWidth: 4
          TabWidth: 4
          UseTab: Never
          BreakBeforeBraces: Allman
          AllowShortIfStatementsOnASingleLine: false
          IndentCaseLabels: false
          ColumnLimit: 80
          EOF

      - name: Find and format C/C++ files
        run: |
          # Find all C/C++ files
          FILES=$(find . -type f -name "*.cpp" -o -name "*.cxx" -o -name "*.cc" -o -name "*.c" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.hh" -o -name "*.h" | grep -v build/ | tr '\n' ' ')
          
          if [ -n "$FILES" ]; then
            echo "Formatting files: $FILES"
            clang-format -style=file -i $FILES
          else
            echo "No C/C++ files found to format"
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Apply clang-format fixes"
          git push
